name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  rust-test:
    name: Rust 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: 测试
        run: cargo test --workspace

  extension-build:
    name: 扩展构建
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/${{ matrix.target }}/package-lock.json
      - name: 安装依赖
        working-directory: extensions/${{ matrix.target }}
        run: npm ci
      - name: 构建
        working-directory: extensions/${{ matrix.target }}
        run: npm run build
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-extension
          path: extensions/${{ matrix.target }}/dist

  model-lint:
    name: 模型代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        working-directory: models
        run: pip install -r training/requirements.txt
      - name: 语法检查
        working-directory: models
        run: |
          python -m py_compile training/*.py
          python -m py_compile conversion/*.py
