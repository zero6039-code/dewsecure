name: Auto Update Rules

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日 UTC 00:00
  workflow_dispatch:

jobs:
  update-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # 需要写 PR 的权限
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extensions/chrome/package-lock.json

      - name: 安装依赖
        working-directory: extensions/chrome
        run: npm ci

      - name: 转换规则
        working-directory: extensions/chrome
        run: npm run update-rules

      - name: 检查变化
        id: check
        run: |
          if git diff --quiet extensions/chrome/rules/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat extensions/chrome/rules/
          fi

      # 🛡️ S-11 修复：不再直推 main，而是创建 PR 供人工审查
      - name: 创建 Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(rules): auto-update ad rules"
          title: "🤖 Rules Update: Auto-generated"
          body: |
            这是一个自动生成的规则更新 PR。
            **请人工检查 `git diff` 确认没有误杀正常网站，且规则数量变化在合理范围内再合并！**
          branch: auto-update-rules
          delete-branch: true
