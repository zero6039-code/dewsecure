name: Auto Update Rules

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日 UTC 00:00
  workflow_dispatch:

jobs:
  update-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extensions/chrome/package-lock.json

      - name: 安装依赖
        working-directory: extensions/chrome
        run: npm ci

      - name: 转换规则
        working-directory: extensions/chrome
        run: npm run update-rules

      - name: 检查变化
        id: check
        run: |
          if git diff --quiet extensions/chrome/rules/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat extensions/chrome/rules/
          fi

      - name: 提交并推送
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extensions/chrome/rules/
          git commit -m "chore(rules): auto-update ad rules $(date -u +%Y-%m-%d)"
          git push
