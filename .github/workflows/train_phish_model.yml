name: Train Phish Model

on:
  schedule:
    - cron: '0 0 * * 1' # 每周一 UTC 00:00
  workflow_dispatch:   # 支持手动触发

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install lightgbm pandas scikit-learn requests tldextract boto3
          
      - name: Download history from R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python models/training/download_r2_data.py
        
      - name: Train and export model
        run: python models/training/train_autonomous.py
        
      - name: Install latest rclone and upload to R2 canary
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          wget https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          cd rclone-*-linux-amd64
          sudo cp rclone /usr/bin/
          sudo chmod 755 /usr/bin/rclone
          cd ..
          
          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          export RCLONE_CONFIG_R2_ENDPOINT=$R2_ENDPOINT
          
          rclone copy extensions/chrome/src/phishscout_local.json r2:$R2_BUCKET/canary/ --s3-no-check-bucket

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore(ai): update PhishScout model with latest Phishing.Database"
          title: "🤖 PhishScout AI Update: Trained on 20,000 samples (AUC 0.9975)"
          branch: auto-update-phish-model
          add-paths: |
            extensions/chrome/src/phishscout_local.json
