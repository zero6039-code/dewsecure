name: Rule Breakage Regression

on:
  pull_request:
    paths:
      - 'extensions/chrome/rules/**' # 仅当规则文件发生变更时触发
  workflow_dispatch:

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          
      - name: Build Extension
        run: |
          cd extensions/chrome
          npm ci
          node build.js
          
      - name: Run Playwright Breakage Tests
        run: |
          # 使用 xvfb 伪造显示器，确保 MV3 扩展能正常加载
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npx playwright test tests/breakage.spec.js
