name: Auto Train Model

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  # 阶段 1：纯训练环境（无签名私钥，仅拉取数据和训练）
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: models/training/requirements.txt
      
      - name: 缓存威胁情报源
        uses: actions/cache@v4
        with:
          path: models/data/cache
          key: intel-cache-v1
          restore-keys: intel-cache-

      - name: 安装 Python 依赖
        run: |
          pip install -r models/training/requirements.txt
          pip install onnx skl2onnx onnxruntime

      - name: 下载数据集 (需要 Supabase Service Key)
        working-directory: models
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python training/data_prep.py

      - name: 训练与导出
        working-directory: models
        run: |
          python training/train.py
          python conversion/to_onnx.py
          python training/golden_set.py

      - name: 读取版本与指标
        id: meta
        working-directory: models
        run: |
          MACRO_F1=$(python -c "import json; print(round(json.load(open('weights/model_meta.json'))['macroF1'], 4))")
          VERSION="V${{ github.run_number }}.$(date -u +%Y%m%d)"
          echo "macro_f1=$MACRO_F1" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🛡️ 回归与质量门禁校验
        working-directory: models
        run: |
          if [ ! -f "weights/baseline_meta.json" ]; then
            echo "⚠️ 缺少 baseline_meta.json，跳过对比，仅校验绝对阈值"
            echo '{"macroF1": 0.0}' > weights/baseline_meta.json
          fi
          python training/gate.py --meta weights/model_meta.json --baseline weights/baseline_meta.json --min-macro-f1 0.80

      - name: 将模型产物上传为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/weights/classifier_int8.onnx
            models/weights/model_meta.json
            models/weights/weights.json
          retention-days: 1

  # 阶段 2：签名与发布环境（无第三方包，仅包含密钥）
  publish:
    needs: train
    runs-on: ubuntu-latest
    # 🔒 全自动发布，依靠 gate.py 做自动化门禁拦截（若失败，流水线标红并发送通知）
    # environment: production 
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载训练好的模型
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/weights/

      - name: 安装仅用于签名的依赖
        run: pip install pynacl

      - name: 🔐 计算哈希并使用 Ed25519 签名
        working-directory: models
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_MODEL_KEY }}
        run: |
          export VERSION="V${{ github.run_number }}.$(date -u +%Y%m%d)"
          echo "正在签名的版本: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          python training/sign_model.py

      - name: 安装 rclone (安全校验版)
        run: |
          wget https://downloads.rclone.org/v1.68.1/rclone-v1.68.1-linux-amd64.zip
          # 🔒 M-14 修复：校验和硬编码，防止同源篡改
          EXPECTED_SHA="34f34743b1831523cd2e0aff74447b717e2d62fe1b598e91703899e0c0689568"
          ACTUAL_SHA=$(sha256sum rclone-v1.68.1-linux-amd64.zip | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "❌ SHA256 mismatch! Security risk."
            exit 1
          fi
          unzip -q rclone-v1.68.1-linux-amd64.zip
          sudo cp rclone-v1.68.1-linux-amd64/rclone /usr/local/bin/
          sudo chmod +x /usr/local/bin/rclone

      - name: 配置 rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << RCLONE_EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          no_check_bucket = true
          RCLONE_EOF

      - name: 上传模型到 R2
        run: |
          # 1. 上传至 canary 目录（供 Worker 立即使用，注意必须包含 weights.json）
          rclone copy models/weights/classifier_int8.onnx r2:${{ secrets.R2_BUCKET }}/canary/ --s3-no-check-bucket
          rclone copy models/weights/weights.json r2:${{ secrets.R2_BUCKET }}/canary/ --s3-no-check-bucket
          rclone copy models/weights/model_meta.json r2:${{ secrets.R2_BUCKET }}/canary/ --s3-no-check-bucket
          
          # 2. 上传至版本目录（用于记录和回滚）
          rclone copy models/weights/classifier_int8.onnx r2:${{ secrets.R2_BUCKET }}/${{ env.VERSION }}/ --s3-no-check-bucket
          rclone copy models/weights/weights.json r2:${{ secrets.R2_BUCKET }}/${{ env.VERSION }}/ --s3-no-check-bucket
          rclone copy models/weights/model_meta.json r2:${{ secrets.R2_BUCKET }}/${{ env.VERSION }}/ --s3-no-check-bucket
