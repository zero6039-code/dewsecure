name: Auto Train Model

on:
  schedule:
    - cron: '0 2 * * *' # 每日凌晨 2 点自动运行
  workflow_dispatch: # 允许手动点击触发

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: models/training/requirements.txt

      # 🚀 方案三：缓存数据集，大幅提升 CI 速度
      - name: 缓存威胁情报源
        uses: actions/cache@v4
        with:
          path: models/data/cache
          key: intel-cache-v1
          restore-keys: |
            intel-cache-

      - name: 安装 Python 依赖
        run: |
          pip install -r models/training/requirements.txt
          pip install onnx skl2onnx onnxruntime pynacl

      - name: 下载数据集 (含 Supabase 反馈拉取与标记)
        working-directory: models
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python training/data_prep.py

      - name: 训练模型
        working-directory: models
        run: python training/train.py

      - name: 导出 ONNX 与 JSON
        working-directory: models
        run: python conversion/to_onnx.py

      - name: 🛡 金标集防御校验 (防投毒)
        working-directory: models
        run: python training/golden_set.py

      - name: 读取模型元信息
        id: meta
        working-directory: models
        run: |
          if [ ! -f weights/model_meta.json ]; then
            echo "❌ model_meta.json 不存在"
            exit 1
          fi
          MACRO_F1=$(python -c "import json; print(round(json.load(open('weights/model_meta.json'))['macroF1'], 4))")
          VERSION="V${{ github.run_number }}.$(date -u +%y%m%d)"
          echo "macro_f1=$MACRO_F1" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ 模型 Macro F1: $MACRO_F1"
          echo "✅ 版本: $VERSION"

      - name: 🔐 计算哈希并使用 Ed25519 签名
        working-directory: models
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: python training/sign_model.py

      - name: 安装 rclone (使用官方最新版避免 R2 501 错误)
        run: |
          wget https://downloads.rclone.org/v1.68.1/rclone-v1.68.1-linux-amd64.deb
          sudo dpkg -i rclone-v1.68.1-linux-amd64.deb
          rclone version

      - name: 配置 rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "[r2]" > ~/.config/rclone/rclone.conf
          echo "type = s3" >> ~/.config/rclone/rclone.conf
          echo "provider = Cloudflare" >> ~/.config/rclone/rclone.conf
          echo "access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}" >> ~/.config/rclone/rclone.conf
          echo "secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}" >> ~/.config/rclone/rclone.conf
          echo "endpoint = ${{ secrets.R2_ENDPOINT }}" >> ~/.config/rclone/rclone.conf
          echo "no_check_bucket = true" >> ~/.config/rclone/rclone.conf

      - name: 上传模型到 R2 - 双轨 ONNX 与 JSON
        run: |
          # 上传 ONNX
          rclone copy models/weights/classifier_int8.onnx \
            r2:${{ secrets.R2_BUCKET }}/canary/ --s3-no-check-bucket --s3-no-head --s3-chunk-size 5M --s3-upload-concurrency 2
          # 上传 Meta (含双端签名)
          rclone copy models/weights/model_meta.json \
            r2:${{ secrets.R2_BUCKET }}/canary/ --s3-no-check-bucket --s3-no-head --s3-chunk-size 5M --s3-upload-concurrency 2
          # 上传纯 JS 权重
          rclone copy models/weights/weights.json \
            r2:${{ secrets.R2_BUCKET }}/canary/ --s3-no-check-bucket --s3-no-head --s3-chunk-size 5M --s3-upload-concurrency 2
          
          # 上传至版本目录备份
          rclone copy models/weights/classifier_int8.onnx \
            r2:${{ secrets.R2_BUCKET }}/${{ steps.meta.outputs.version }}/ --s3-no-check-bucket --s3-no-head --s3-chunk-size 5M --s3-upload-concurrency 2
          rclone copy models/weights/weights.json \
            r2:${{ secrets.R2_BUCKET }}/${{ steps.meta.outputs.version }}/ --s3-no-check-bucket --s3-no-head --s3-chunk-size 5M --s3-upload-concurrency 2

          echo "=== canary 目录内容 ==="
          rclone ls r2:${{ secrets.R2_BUCKET }}/canary/ --s3-no-check-bucket

      - name: 记录训练历史（不包含模型文件）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: "Model ${{ steps.meta.outputs.version }} (F1=${{ steps.meta.outputs.macro_f1 }})"
          body: |
            Auto-trained 3-class model

            - Macro F1: ${{ steps.meta.outputs.macro_f1 }}
            - Trained at: ${{ github.event.repository.updated_at }}
            - Model file size: 49 KB (INT8) / < 1 MB (JSON)
            - Delivery: Cloudflare R2 (private, presigned URL only)

            ⚠️ Model files are NOT attached to this release.
            ⚠️ Model is distributed via R2 with 60-second presigned URLs.
          draft: true
          files: |
            models/weights/model_meta.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
