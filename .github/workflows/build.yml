name: Build & Release Extension

on:
  push:
    tags:
      - 'v*' # 打 tag 时触发
  workflow_dispatch: # 允许手动触发

# 赋予 Actions 推送代码的权限
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # 🌟 核心修复：强制切换到 main 分支，并获取完整历史，解决 detached HEAD 报错
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build (All Platforms)
        run: |
          # Chrome
          cd extensions/chrome
          npm install
          node build.js
          cd ../..

          # Firefox
          cd extensions/firefox
          npm install
          node build.js
          cd ../..

          # Opera
          cd extensions/opera
          npm install
          node build.js
          cd ../..

      - name: Get Version & Prepare Release Directory
        id: get_version
        run: |
          # 从 chrome/manifest.json 提取版本号，例如 "1.2.5"
          VERSION=$(node -p "require('./extensions/chrome/manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # 创建各端的归档目录
          mkdir -p releases/chrome releases/firefox releases/opera

      - name: Create Zip Archives
        run: |
          # 打包 Chrome
          cd extensions/chrome/dist
          zip -r ../../../releases/chrome/chrome-v${{ env.VERSION }}.zip .
          cd ../../..
          
          # 打包 Firefox
          cd extensions/firefox/dist
          zip -r ../../../releases/firefox/dewsecure-firefox-v${{ env.VERSION }}.zip .
          cd ../../..
          
          # 打包 Opera
          cd extensions/opera/dist
          zip -r ../../../releases/opera/opera-v${{ env.VERSION }}.zip .
          cd ../../..

      - name: Commit and Push Artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 🌟 核心修复：使用 -f 强制添加，无视 .gitignore 的 *.zip 忽略规则
          git add -f releases/
          
          # 检查是否有变更，如果有才 commit
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-build extensions v${{ env.VERSION }} (Chrome/Firefox/Opera)"
            # 🌟 核心修复：明确推送到 main 分支
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
