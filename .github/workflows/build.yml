name: Build & Release Extension

on:
  push:
    tags:
      - 'v*' # 打 tag 时触发
  workflow_dispatch: # 允许手动触发

# 赋予 Actions 推送代码的权限
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build
        run: |
          cd extensions/chrome
          npm install
          npm run build

      - name: Get Version & Prepare Release Directory
        id: get_version
        run: |
          # 从 manifest.json 提取版本号
          VERSION=$(node -p "require('./extensions/chrome/manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p releases/chrome

      - name: Create Zip Archive
        run: |
          cd extensions/chrome/dist
          # 打包为 chrome-v版本号.zip 并存放到根目录
          zip -r ../../../releases/chrome/chrome-v${{ env.VERSION }}.zip .

      - name: Commit and Push Artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add releases/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-build chrome extension v${{ env.VERSION }}"
            # 拉取最新代码避免冲突，然后再推送
            git pull origin main --rebase
            git push origin main
          else
            echo "No changes to commit"
          fi
