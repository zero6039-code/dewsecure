name: Build & Release Extension

on:
  push:
    tags:
      - 'v*' # 打 tag 时触发
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build
        run: |
          cd extensions/chrome
          npm install
          npm run build

      - name: Get Version & Prepare Release Directory
        id: get_version
        run: |
          VERSION=$(node -p "require('./extensions/chrome/manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p releases/chrome

      - name: Create Zip Archive
        run: |
          cd extensions/chrome/dist
          zip -r ../../../releases/chrome/chrome-v${{ env.VERSION }}.zip .

      - name: Commit and Push Artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-build chrome extension v${{ env.VERSION }}"
            # 🌟 核心修复：强制推送到远端 main 分支，无视 detached HEAD
            git pull origin main --rebase
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/chrome/*.zip
          name: Release v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
