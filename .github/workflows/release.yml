name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 🛡️ S-11 修复：默认只读，发布步骤才给写权限
permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 仅在这个 Job 赋予 Release 的写权限
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build
        run: |
          cd extensions/chrome
          npm ci # 🛡️ 使用 npm ci 保证依赖可复现
          npm run build

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./extensions/chrome/manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Zip Archive
        run: |
          cd extensions/chrome/dist
          # 在临时目录打包，绝对不放进仓库目录
          zip -r /tmp/chrome-v${{ env.VERSION }}.zip .

      # 🛡️ S-11 修复：直接发布到 GitHub Release，不污染代码库
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/chrome-v${{ env.VERSION }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
