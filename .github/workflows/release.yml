name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-extensions:
    name: 构建扩展
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建 Chrome 扩展
        working-directory: extensions/chrome
        run: npm ci && npm run build

      - name: 打包 Chrome 扩展
        run: |
          cd extensions/chrome/dist
          zip -r ../../../dewsecure-chrome-${{ github.ref_name }}.zip .

      - name: 构建 Firefox 扩展
        working-directory: extensions/firefox
        run: npm ci && npm run build

      - name: 打包 Firefox 扩展
        run: |
          cd extensions/firefox/dist
          zip -r ../../../dewsecure-firefox-${{ github.ref_name }}.zip .

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dewsecure-chrome-*.zip
            dewsecure-firefox-*.zip
          draft: true
