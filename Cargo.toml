[workspace]
members = [
    "core",
    "server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = ["DewSecure Team"]
repository = "https://github.com/zero6039-code/dewsecure/"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# A0-6a：UniFFI 绑定生成专用 profile
# release 的 strip = true 会剥离 UniFFI 元数据 section，导致 uniffi-bindgen --library 静默失败
# strip = "debuginfo" 只剥离 debug 信息，保留自定义 section 和符号表
[profile.uniffi]
inherits = "release"
strip = "debuginfo"
