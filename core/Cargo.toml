[package]
name = "dewsecure-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
android_logger = "0.13"
log = "0.4"
http-body-util = "0.1"
futures = "0.3"
bytes = "1"
aws-lc-rs = "1"
tokio = { version = "1.53.3", features = ["full", "net"] }
netstack-smoltcp = "0.2"
tun-rs = { version = "2", features = ["async", "async_framed"] }
hudsucker = { version = "0.23", features = ["rcgen-ca", "rustls-client"] }
hyper = { version = "1.4", features = ["full"] }
rcgen = "0.13"
rustls = "0.23"

hex = "0.4"
semver = "1.0"
uniffi = { version = "0.28", features = ["cli"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# A2：模型签名验签（与 JS modelManager.js 的 Ed25519 协议一致）
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
aho-corasick = "1.1"

[dev-dependencies]
proptest = "1.4"
pretty_assertions = "1.4"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"