[package]
name = "dewsecure-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
hex = "0.4"
semver = "1.0"
uniffi = { version = "0.28", features = ["cli"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
aho-corasick = "1.1"
fst = "0.4"

# 网络与代理依赖
tokio = { version = "1.40", features = ["full"] }
hudsucker = { version = "0.23.0", default-features = false, features = [
    "decoder",
    "rcgen-ca",
    "rustls-client",
    "http2"
] }
hyper = { version = "1.4", features = ["full"] }
rcgen = "0.13"
rustls = "0.23"
netstack-smoltcp = "0.2"
smoltcp = "0.10"
libc = "0.2"
futures = "0.3"
bytes = "1"
android_logger = "0.13"
log = "0.4"

[dev-dependencies]
proptest = "1.4"
pretty_assertions = "1.4"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[build-dependencies]
fst = "0.4"
serde_json = "1.0"
